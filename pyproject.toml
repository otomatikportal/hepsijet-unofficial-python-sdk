[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hepsijet"
version = "0.1.0"
description = "A typed, readable Python SDK for the HepsiJET cargo API (sync + async)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Omer", email = "omer@novosdijital.com" },
]
dependencies = [
    "httpx>=0.27",
    "pydantic[email]>=2.6",
    "typing-extensions>=4.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/otomatikportal/hepsijet-unofficial-python-sdk"
Repository = "https://github.com/otomatikportal/hepsijet-unofficial-python-sdk"
Issues = "https://github.com/otomatikportal/hepsijet-unofficial-python-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hepsijet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Turkish letters (ı, İ, ş) are intentional
